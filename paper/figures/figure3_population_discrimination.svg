<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" style="background:#0d1117; font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <text x="30" y="32" fill="#f0f6fc" font-size="16" font-weight="bold">Figure 3: Out-of-Fold Generalization &amp; Baseline Discrimination (N=60 Arenas, 9,000 Episodes)</text>
  <text x="30" y="52" fill="#8b949e" font-size="12">Leave-One-Geometry-Family-Out Cross-Validation (LOGFO-CV) across 6 held-out mechanism families.</text>

  <!-- Left: LOGFO-AUC Bar Comparison Chart -->
  <g transform="translate(30, 75)">
    <rect width="530" height="315" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="25" fill="#f0f6fc" font-size="13" font-weight="bold">Out-of-Fold Discriminative Power (LOGFO-AUC)</text>
    <text x="20" y="42" fill="#8b949e" font-size="10">Evaluating zero-shot transfer across completely held-out geometry archetypes</text>

    <!-- Bar 1: Tactical Margin -->
    <g transform="translate(20, 65)">
      <text x="0" y="15" fill="#58a6ff" font-size="11" font-weight="bold">Tactical Margin (M_tic)</text>
      <!-- Track & Fill -->
      <rect x="170" y="3" width="280" height="18" fill="#090d13" stroke="#30363d" rx="3"/>
      <rect x="170" y="3" width="280" height="18" fill="#58a6ff" rx="3"/>
      <text x="460" y="16" fill="#58a6ff" font-size="11" font-weight="bold">1.0000</text>
      <text x="170" y="32" fill="#3fb950" font-size="9" font-weight="bold">★ Perfect LOGFO discrimination (Spearman ρ = +0.9282, p &lt; 1e-12)</text>
    </g>

    <!-- Bar 2: Hamiltonian Workload -->
    <g transform="translate(20, 115)">
      <text x="0" y="15" fill="#f0f6fc" font-size="11">Hamiltonian Workload (B)</text>
      <rect x="170" y="3" width="280" height="18" fill="#090d13" stroke="#30363d" rx="3"/>
      <rect x="170" y="3" width="231.3" height="18" fill="#3fb950" opacity="0.85" rx="3"/>
      <text x="460" y="16" fill="#f0f6fc" font-size="11">0.8260</text>
      <text x="170" y="32" fill="#8b949e" font-size="9">AUC gap: −0.1740 (17.40 percentage points lower)</text>
    </g>

    <!-- Bar 3: Peak Physical LOS -->
    <g transform="translate(20, 165)">
      <text x="0" y="15" fill="#f0f6fc" font-size="11">Peak Physical LOS (K_static)</text>
      <rect x="170" y="3" width="280" height="18" fill="#090d13" stroke="#30363d" rx="3"/>
      <rect x="170" y="3" width="226.7" height="18" fill="#d29922" opacity="0.85" rx="3"/>
      <text x="460" y="16" fill="#f0f6fc" font-size="11">0.8098</text>
      <text x="170" y="32" fill="#8b949e" font-size="9">AUC gap: −0.1902 (19.02 percentage points lower)</text>
    </g>

    <!-- Bar 4: Static Minimum Slack -->
    <g transform="translate(20, 215)">
      <text x="0" y="15" fill="#f0f6fc" font-size="11">Minimum Slack (σ_min)</text>
      <rect x="170" y="3" width="280" height="18" fill="#090d13" stroke="#30363d" rx="3"/>
      <rect x="170" y="3" width="160.8" height="18" fill="#f85149" opacity="0.85" rx="3"/>
      <text x="460" y="16" fill="#f0f6fc" font-size="11">0.5742</text>
      <text x="170" y="32" fill="#8b949e" font-size="9">AUC gap: −0.4258 (42.58 percentage points lower)</text>
    </g>

    <!-- X Axis Scale -->
    <g transform="translate(190, 270)">
      <line x1="0" y1="0" x2="280" y2="0" stroke="#30363d"/>
      <text x="0" y="14" fill="#8b949e" font-size="9" text-anchor="middle">0.0</text>
      <text x="140" y="14" fill="#8b949e" font-size="9" text-anchor="middle">0.5</text>
      <text x="280" y="14" fill="#8b949e" font-size="9" text-anchor="middle">1.0</text>
      <text x="140" y="28" fill="#8b949e" font-size="10" text-anchor="middle">LOGFO Area Under Curve (AUC)</text>
    </g>
  </g>

  <!-- Right: Benchmark Performance Summary Table -->
  <g transform="translate(580, 75)">
    <rect width="390" height="315" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="25" fill="#f0f6fc" font-size="13" font-weight="bold">LOGFO Cross-Validation Summary</text>
    <text x="20" y="42" fill="#8b949e" font-size="10">6 held-out families (Staggered, Crossfire, Burst, Flank, Deadline, Smooth)</text>

    <!-- Table Header -->
    <g transform="translate(20, 60)">
      <rect width="350" height="24" fill="#21262d" rx="3"/>
      <text x="10" y="16" fill="#f0f6fc" font-size="10" font-weight="bold">Metric Evaluated</text>
      <text x="165" y="16" fill="#f0f6fc" font-size="10" font-weight="bold">LOGFO-AUC</text>
      <text x="260" y="16" fill="#f0f6fc" font-size="10" font-weight="bold">AUC Difference</text>
    </g>

    <!-- Row 1: Tactical Margin -->
    <g transform="translate(20, 90)">
      <rect width="350" height="30" fill="rgba(88,166,255,0.12)" stroke="#58a6ff" stroke-width="1.2" rx="3"/>
      <text x="10" y="19" fill="#58a6ff" font-size="10" font-weight="bold">Tactical Margin (M_tic)</text>
      <text x="165" y="19" fill="#58a6ff" font-size="10" font-weight="bold">1.0000</text>
      <text x="260" y="19" fill="#3fb950" font-size="10" font-weight="bold">Baseline (ρ=.93)</text>
    </g>

    <!-- Row 2: Hamiltonian Workload -->
    <g transform="translate(20, 126)">
      <rect width="350" height="26" fill="#090d13" stroke="#30363d" rx="3"/>
      <text x="10" y="17" fill="#8b949e" font-size="10">Hamiltonian Workload (B)</text>
      <text x="165" y="17" fill="#f0f6fc" font-size="10">0.8260</text>
      <text x="260" y="17" fill="#8b949e" font-size="10">−17.40 pts</text>
    </g>

    <!-- Row 3: Peak Physical LOS -->
    <g transform="translate(20, 158)">
      <rect width="350" height="26" fill="#090d13" stroke="#30363d" rx="3"/>
      <text x="10" y="17" fill="#8b949e" font-size="10">Peak Physical LOS (K_static)</text>
      <text x="165" y="17" fill="#f0f6fc" font-size="10">0.8098</text>
      <text x="260" y="17" fill="#8b949e" font-size="10">−19.02 pts</text>
    </g>

    <!-- Row 4: Static Minimum Slack -->
    <g transform="translate(20, 190)">
      <rect width="350" height="26" fill="#090d13" stroke="#30363d" rx="3"/>
      <text x="10" y="17" fill="#8b949e" font-size="10">Minimum Slack (σ_min)</text>
      <text x="165" y="17" fill="#f0f6fc" font-size="10">0.5742</text>
      <text x="260" y="17" fill="#8b949e" font-size="10">−42.58 pts</text>
    </g>

    <text x="20" y="240" fill="#8b949e" font-size="10" width="350">
      <tspan x="20" dy="0">Generalization Principle: By holding out entire geometric families</tspan>
      <tspan x="20" dy="14">during cross-validation, LOGFO testing confirms that Tactical Margin</tspan>
      <tspan x="20" dy="14">captures general temporal clearability rather than overfitting to specific</tspan>
      <tspan x="20" dy="14">spatial layout templates.</tspan>
    </text>
  </g>
</svg>