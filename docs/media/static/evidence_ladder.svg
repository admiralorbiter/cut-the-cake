<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cardGradBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGradYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad)" />

  <!-- Header -->
  <text x="50" y="50" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">SCIENTIFIC RIGOR &amp; REPRODUCIBILITY</text>
  <text x="50" y="85" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold">The Cut the Cake Evidence Ladder</text>
  <text x="50" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">A 7-tier hierarchy separating formal mathematics, engine validation, and prospective human boundaries.</text>

  <!-- Tier 7: Prospective Human Calibration (Unproven Boundary) -->
  <g transform="translate(50, 140)">
    <rect width="900" height="54" rx="8" fill="url(#cardGradYellow)" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="35" cy="27" r="14" fill="#f59e0b" />
    <text x="35" y="32" fill="#000" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">7</text>
    <text x="65" y="25" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Human Population Calibration</text>
    <text x="65" y="43" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11">Pre-registered pilot protocol (human/PILOT_PROTOCOL.md); empirical human validation is prospective.</text>
    <rect x="750" y="14" width="130" height="26" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="1" />
    <text x="815" y="31" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PROSPECTIVE</text>
  </g>

  <!-- Tier 6: 2.5D & 3D Execution (Horizon 6) -->
  <g transform="translate(50, 205)">
    <rect width="900" height="54" rx="8" fill="url(#cardGradGreen)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="35" cy="27" r="14" fill="#10b981" />
    <text x="35" y="32" fill="#000" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">6</text>
    <text x="65" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2.5D Elevation &amp; 3D Controller Execution (Horizon 6)</text>
    <text x="65" y="43" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Spherical geodesic slew (SO(3) Slerp), extruded prism raycasting, 138 CAD acceptance tests passed.</text>
    <rect x="750" y="14" width="130" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="815" y="31" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Tier 5: Real-Map-Shaped Grayboxes -->
  <g transform="translate(50, 270)">
    <rect width="900" height="54" rx="8" fill="url(#cardGradGreen)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="35" cy="27" r="14" fill="#10b981" />
    <text x="35" y="32" fill="#000" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">5</text>
    <text x="65" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Real-Map Graybox Case Studies (Dust II, Ascent, Transit 213)</text>
    <text x="65" y="43" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Pre-registered mechanisms; confirmed Suffix Margin superiority and model refusal on dry chokes.</text>
    <rect x="750" y="14" width="130" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="815" y="31" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Tier 4: Native Game Engine Transfer (ViZDoom) -->
  <g transform="translate(50, 335)">
    <rect width="900" height="54" rx="8" fill="url(#cardGradGreen)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="35" cy="27" r="14" fill="#10b981" />
    <text x="35" y="32" fill="#000" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">4</text>
    <text x="65" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">External Engine Transfer (Native C++ Doom / ViZDoom)</text>
    <text x="65" y="43" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">50-arena population benchmark: 80% source repair, 75% engine transfer efficiency.</text>
    <rect x="750" y="14" width="130" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="815" y="31" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">VALIDATED</text>
  </g>

  <!-- Tier 3: Discrete Simulation Sweeps -->
  <g transform="translate(50, 400)">
    <rect width="900" height="54" rx="8" fill="url(#cardGradGreen)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="35" cy="27" r="14" fill="#10b981" />
    <text x="35" y="32" fill="#000" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3</text>
    <text x="65" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">9,000 Discrete 35-Hz Simulation Episodes</text>
    <text x="65" y="43" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Tested across 60 arenas; Tactical Margin achieved ROC-AUC = 1.0000 (+19% over static counts).</text>
    <rect x="750" y="14" width="130" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="815" y="31" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PROVEN</text>
  </g>

  <!-- Tier 2: Procedural PCG Sweeps -->
  <g transform="translate(50, 465)">
    <rect width="900" height="54" rx="8" fill="url(#cardGradGreen)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="35" cy="27" r="14" fill="#10b981" />
    <text x="35" y="32" fill="#000" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2</text>
    <text x="65" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Synthetic Procedural Assembly (25,000 PCG Candidates)</text>
    <text x="65" y="43" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Evaluated modular dungeon assemblies with 0 false certifications at compile time (&lt; 0.1 ms).</text>
    <rect x="750" y="14" width="130" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="815" y="31" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PROVEN</text>
  </g>

  <!-- Tier 1: Formal Mathematics -->
  <g transform="translate(50, 530)">
    <rect width="900" height="54" rx="8" fill="url(#cardGradGreen)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="35" cy="27" r="14" fill="#10b981" />
    <text x="35" y="32" fill="#000" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1</text>
    <text x="65" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Formal Scheduling &amp; Min-Plus Dioid Algebra</text>
    <text x="65" y="43" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Exact non-preemptive single-machine formulation (1 | r_j, s_ij | L_max) &amp; C ≡ D theorem.</text>
    <rect x="750" y="14" width="130" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="815" y="31" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PROVEN</text>
  </g>

  <!-- Footer note -->
  <text x="500" y="620" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Cut the Cake Framework — Big Brain Time Research Collective (2026)</text>
</svg>
