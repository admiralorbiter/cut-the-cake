[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v
markers =
    cad: Routine CAD authoring, scenario editing, repair optimizer, Auto-Fix, and document session verification
    browser: Headless Playwright browser E2E workflows
    vizdoom: ViZDoom C++ native engine execution and bridge tests
    population: Monte Carlo population sweeps and statistical benchmark shootouts
    engine: Tests running real C++ ViZDoom DoomGame instances
    scientific: Mathematical and computational proof gates
    slow: Intentionally slow sweeps, population rollouts, and engine benchmarks
